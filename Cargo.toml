[package]
name = "mi6-bunker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
axum = { version = "0.8.9", features = ["macros"] }
brotli = "8.0.4"
dotenvy = "0.15.7"
futures = "0.3.34"
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "std",
    "fmt",
] }
url = "2.5.8"
uuid = { version = "1.25.0", features = ["v4", "fast-rng"] }
wreq = { version = "0.16", features= ["form", "json"] }
wreq-util = "0.2"
